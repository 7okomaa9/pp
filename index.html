<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="description" content="مساحة أشرف الدراسية لتنظيم المواد والمهام والملاحظات وجدول المذاكرة.">
  <title>مساحة أشرف الدراسية | StudyHub</title>
  <link rel="stylesheet" href="./assets/style.css?v=3">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="home" aria-label="الرئيسية">
        <span class="brand-mark">S</span>
        <span><b>StudyHub</b><small>مساحة أشرف الدراسية</small></span>
      </a>
      <div class="side-label">مساحتك</div>
      <nav class="nav">
        <button class="nav-item active" data-page="home"><span>⌂</span> الرئيسية</button>
        <button class="nav-item" data-page="courses"><span>▤</span> المواد والمحاضرات</button>
        <button class="nav-item" data-page="tasks"><span>✓</span> المهام</button>
        <button class="nav-item" data-page="schedule"><span>▦</span> جدول المذاكرة</button>
        <button class="nav-item" data-page="notes"><span>▧</span> ملاحظاتي</button>
        <button class="nav-item" data-page="files"><span>↥</span> ملفاتي</button>
        <button class="nav-item" data-page="assistant"><span>✳</span> مساعد المذاكرة</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-status"><span class="status-dot"></span><span><b>حفظ على جهازك</b><small>البيانات لا تنتقل تلقائيًا بين الأجهزة</small></span></div>
        <button class="nav-item" data-action="export"><span>⇩</span> نسخة احتياطية</button>
        <button class="nav-item" data-action="import"><span>⇧</span> استعادة نسخة</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="فتح القائمة">☰</button>
        <div class="crumb">مساحتك الدراسية <span>/</span> <b id="pageTitle">الرئيسية</b></div>
        <div class="top-actions"><span class="today-pill" id="todayPill"></span><button class="avatar" title="مساحتك">أ</button></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
      <footer>StudyHub · نسخة GitHub Pages · بياناتك محفوظة في هذا المتصفح</footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="dialog"><form id="dialogForm"><div class="dialog-head"><h2 id="dialogTitle">إضافة</h2><button class="icon-btn" value="cancel" aria-label="إغلاق">×</button></div><div id="dialogBody"></div><div class="dialog-actions"><button class="btn btn-light" value="cancel">إلغاء</button><button class="btn btn-primary" id="dialogSave" type="submit">حفظ</button></div></form></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="./assets/app.js?v=3"></script>
</body>
</html>
